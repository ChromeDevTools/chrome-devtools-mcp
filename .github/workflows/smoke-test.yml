name: Bundle smoke test

permissions:
  contents: read

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:

jobs:
  smoke-test:
    name: '[Required] Bundle smoke test (${{ matrix.os }})'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        shell: bash
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Bundle
        shell: bash
        run: npm run bundle
        env:
          NODE_ENV: 'production'

      - name: Remove node_modules
        shell: bash
        run: rm -rf node_modules

      - name: Smoke test bundled binaries
        shell: bash
        run: |
          node ./build/src/bin/chrome-devtools-mcp.js --version
          node ./build/src/bin/chrome-devtools.js --version
